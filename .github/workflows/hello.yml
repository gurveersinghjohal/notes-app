name: Hello

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check server.js syntax
        run: node --check server.js

  hello:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "hello"

      - name: Print what triggered this
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"