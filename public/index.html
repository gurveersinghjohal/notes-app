<h1>Notes</h1>
<input id="t"><button onclick="add()">Add</button>
<ul id="list"></ul>
<script>
async function load(){
  const r = await fetch("/api/notes"); const n = await r.json();
  list.innerHTML = n.map(x => `<li>${x.text}</li>`).join("");
}
async function add(){
  await fetch("/api/notes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t.value})});
  t.value=""; load();
}
load();
</script>
